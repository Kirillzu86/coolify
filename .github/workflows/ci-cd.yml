name: CI/CD Pipeline & Coolify Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. Backend Checks & Tests
  # ----------------------------------------------------
  backend-checks:
    name: Backend Lint & Django Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-test'
          DJANGO_DEBUG: 'True'
        run: |
          python manage.py check

  # ----------------------------------------------------
  # 2. Frontend Checks & Build
  # ----------------------------------------------------
  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type Check & Build
        run: npm run build

  # ----------------------------------------------------
  # 3. Coolify Deploy Webhook Trigger
  # ----------------------------------------------------
  deploy:
    name: Trigger Coolify Deployment
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Resource Deploy
        if: env.COOLIFY_BACKEND_WEBHOOK != ''
        env:
          COOLIFY_BACKEND_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
        run: |
          echo "Triggering Coolify Backend Webhook..."
          curl -s -X GET "$COOLIFY_BACKEND_WEBHOOK" || true

      - name: Trigger Frontend Resource Deploy
        if: env.COOLIFY_FRONTEND_WEBHOOK != ''
        env:
          COOLIFY_FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
        run: |
          echo "Triggering Coolify Frontend Webhook..."
          curl -s -X GET "$COOLIFY_FRONTEND_WEBHOOK" || true
